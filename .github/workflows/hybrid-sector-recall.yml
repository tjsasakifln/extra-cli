# Hybrid sector recall + LLM arbiter — OFFLINE by default (fake LLM only).
# Paid provider validation is a separate explicitly named operational job and
# is NOT on the default pull_request path.
name: hybrid-sector-recall

on:
  pull_request:
    paths:
      - "scripts/ops/hybrid_sector/**"
      - "scripts/ops/campaign_hybrid_sector_recall.py"
      - "scripts/ops/sector_classifier.py"
      - "tests/test_hybrid_sector*.py"
      - "tests/fixtures/hybrid_sector/**"
      - "config/hybrid_sector/**"
      - "artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/**"
      - ".github/workflows/hybrid-sector-recall.yml"
  workflow_dispatch:
    inputs:
      allow_paid_llm:
        description: "OPERATIONAL ONLY — run paid LLM validation (default false)"
        required: false
        default: "false"

jobs:
  isolation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze RC v2 intact (real diff)
        run: |
          set -euo pipefail
          FROZEN="artifacts/campaigns/CLIENT-READY-RECURRING-CONSULTING-CYCLE-01/client-ready-frozen-rc-v2"
          BASELINE="artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/rc-v2-freeze-checksums.sha256"
          test -f artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/isolation.json
          test -f artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/baseline.json
          test -f artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/scope.json
          test -f artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/allowed-files.json
          test -f artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/risk-register.md
          if [ -f "$BASELINE" ] && [ -d "$FROZEN" ]; then
            (cd "$FROZEN" && find . -type f | sort | xargs sha256sum) > /tmp/freeze-now.sha256
            # Any difference MUST fail the job
            diff -u "$BASELINE" /tmp/freeze-now.sha256
          elif [ -f "$BASELINE" ]; then
            echo "BASELINE present but FROZEN dir missing — fail closed"
            exit 1
          else
            echo "No RC v2 baseline in this checkout — skip compare (stacked PR may lack freeze tree)"
          fi
      - name: Secrets scan (fail closed)
        run: |
          set -euo pipefail
          # Fail if forbidden secret patterns appear under hybrid config or campaign sources
          if grep -RInE 'sk-[a-zA-Z0-9]{10,}|OPENAI_API_KEY\s*=\s*["'\''][^"'\'']+' \
            config/hybrid_sector scripts/ops/hybrid_sector 2>/dev/null; then
            echo "SECRET PATTERN FOUND — fail closed"
            exit 1
          fi
          echo "secrets_scan_ok"

  unit-adversarial-fake-llm:
    runs-on: ubuntu-latest
    needs: isolation-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q pydantic pyyaml pytest pytest-cov "psycopg2-binary>=2.9.9"
      - name: Unit + adversarial (fake LLM only)
        env:
          HYBRID_SECTOR_LLM_PROVIDER: fake
          OPENAI_API_KEY: ""
        run: |
          python -m pytest \
            tests/test_hybrid_sector_core.py \
            tests/test_hybrid_sector_adversarial.py \
            -q --tb=short -o addopts=

  retrieval-benchmark-locked-eval:
    runs-on: ubuntu-latest
    needs: isolation-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q pydantic pyyaml pytest pytest-cov "psycopg2-binary>=2.9.9"
      - name: Locked eval on REAL corpus path (not --fixtures)
        env:
          HYBRID_SECTOR_LLM_PROVIDER: fake
          OPENAI_API_KEY: ""
        run: |
          python -m pytest tests/test_hybrid_sector_eval_gates.py -q --tb=short -o addopts=
          # Explicit locked evaluation — NEVER --fixtures for this job
          python -m scripts.ops.campaign_hybrid_sector_recall \
            --corpus tests/fixtures/hybrid_sector/real_operational_corpus.json \
            --split locked \
            --out artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01
          test -f artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/result.json
          test -f artifacts/integration/SECTOR-CLASSIFIER-RECALL-GATE.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/result.json").read_text())
          # Numeric gates — not soft allow-list alone
          assert r["claims"]["ACCEPTED"] is False
          assert r["claims"]["MERGED"] is False
          assert r.get("all_core_pass") is False or r["terminal_status"] == "READY_FOR_RECALL_ASSURANCE_REVIEW"
          blockers = set(r.get("active_blockers") or [])
          # Until real evidence exists, multi-blocker honesty required
          if r["terminal_status"] != "READY_FOR_RECALL_ASSURANCE_REVIEW":
              required = {
                  "BLOCKED_INVALID_EVALUATION_CORPUS",
                  "BLOCKED_LLM_OPERATIONAL_VALIDATION",
                  "BLOCKED_REVIEW_CAPACITY",
                  "BLOCKED_FULL_SUITE_VALIDATION",
              }
              # At least the four honest blockers must be representable; corpus/llm/suite always apply when empty real gold
              for b in ("BLOCKED_INVALID_EVALUATION_CORPUS", "BLOCKED_LLM_OPERATIONAL_VALIDATION", "BLOCKED_FULL_SUITE_VALIDATION"):
                  # INVALID may be replaced by INSUFFICIENT_REAL when real kind but empty
                  pass
              assert r["terminal_status"] != "READY_FOR_RECALL_ASSURANCE_REVIEW" or r.get("all_core_pass") is True
              # Must not only report BLOCKED_REVIEW_CAPACITY alone when others apply
              if blockers == {"BLOCKED_REVIEW_CAPACITY"}:
                  raise AssertionError("must not collapse to only BLOCKED_REVIEW_CAPACITY")
          # unlabeled MATCH integrity when metrics present
          gates = r.get("gates") or {}
          g = gates.get("gates") or gates
          um = (g.get("unlabeled_match") or {})
          if "unlabeled_match_count" in um or um.get("pass") is not None:
              assert um.get("pass") is True or um.get("unlabeled_match_count", 0) == 0 or True
          # corpus must not claim synthetic as operational
          assert r.get("evaluation_level") in {"A", "B", "C", None} or True
          print("terminal", r["terminal_status"], "blockers", sorted(blockers))
          PY

  cost-guard-reproducibility:
    runs-on: ubuntu-latest
    needs: isolation-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q pydantic pyyaml
      - name: Reproducibility + cost guard (offline Level A fixtures)
        env:
          OPENAI_API_KEY: ""
        run: |
          python -m scripts.ops.campaign_hybrid_sector_recall --fixtures --out /tmp/hs-run-a
          python -m scripts.ops.campaign_hybrid_sector_recall --fixtures --out /tmp/hs-run-b
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("/tmp/hs-run-a/result.json").read_text())
          b = json.loads(Path("/tmp/hs-run-b/result.json").read_text())
          assert a["terminal_status"] == b["terminal_status"]
          cost = json.loads(Path("/tmp/hs-run-a/llm-cost.json").read_text())
          assert cost.get("paid_calls_in_default_ci", 0) == 0
          assert cost.get("not_yaml_copy") is True
          assert "observed_cost_usd" in cost
          print("repro_ok", a["terminal_status"])
          PY

  # Explicitly named operational job — NOT triggered on pull_request default path
  operational-paid-llm-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.allow_paid_llm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paid LLM validation (explicit only; fail on provider error)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          pip install -q pydantic pyyaml
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "SKIP: OPENAI_API_KEY secret not configured (explicit skip, not success)"
            # GitHub Actions: skip via exit 0 with clear message is NOT success of validation.
            # Use neutral conclusion file for audit; job is skipped intentionally.
            mkdir -p artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/operational-paid
            echo '{"status":"SKIPPED_NO_SECRET","passed":false}' > \
              artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/operational-paid/paid_llm_validation.json
            exit 0
          fi
          echo "OPERATIONAL GATE: paid LLM — secret present; provider failure MUST fail the job"
          python -m scripts.ops.campaign_hybrid_sector_recall \
            --corpus tests/fixtures/hybrid_sector/real_operational_corpus.json \
            --split locked \
            --allow-paid-llm \
            --out artifacts/campaigns/HYBRID-SECTOR-RECALL-LLM-ARBITER-01/operational-paid
