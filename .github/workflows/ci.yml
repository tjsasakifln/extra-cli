# CI Pipeline — Extra Consultoria
#
# Runs on every push to main and every PR targeting main.
# Stages: lint (ruff) -> type-check (mypy) -> test (pytest) + security (bandit)
#
# Story TD-4.2: Setup CI/CD Pipeline
# Debts: TD-OPS-01, TD-SYS-015
#
# Regra #10 (B2G-4): Gates fail-closed — bandit, pip-audit, coverage threshold
# NENHUM job usa continue-on-error:true ou || true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # LINT — ruff
  # ============================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff linter
        # Framework/agent assets are vendored tooling. Product lint debt is
        # tracked under TD-7.1, so the blocking gate targets production code.
        run: ruff check scripts/

  # ============================================================================
  # TYPE CHECK — mypy
  # ============================================================================
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run mypy type check
        # Start strict typing at the current business-critical boundary and
        # expand it module-by-module under TD-7.1. Resilience modules included.
        run: |
          mypy \
            scripts/freshness_gate.py \
            scripts/lib/universe.py \
            scripts/opportunity_intel/models.py \
            scripts/opportunity_intel/status.py \
            scripts/opportunity_intel/ranking.py \
            scripts/opportunity_intel/dedup.py \
            scripts/opportunity_intel/transformer.py
          mypy --follow-imports=skip \
            scripts/crawl/ingestion/_base/crawler.py \
            scripts/crawl/resilience \
            scripts/ops/resilient_cycle.py \
            scripts/ops/health.py

  # ============================================================================
  # TEST — critical readiness regression suite
  # ============================================================================
  test:
    name: Test (critical readiness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov hypothesis

      - name: Run critical readiness tests with coverage
        run: >-
          pytest
          tests/test_freshness_gate.py
          tests/test_freshness_by_entity.py
          tests/test_universe.py
          tests/test_manifest.py
          tests/test_consulting_readiness.py
          tests/test_coverage_truth.py
          tests/test_resolve_unresolved_entities.py
          tests/test_golden_path_fail_closed.py
          tests/test_golden_path_ledger.py
          tests/test_contracts_window_complete.py
          tests/test_contracts_pilot_completion.py
          tests/test_evidence_artifact_consistency.py
          tests/test_cross_source_hash.py
          tests/test_commercial_sample_sc.py
          tests/test_run_evidence.py
          tests/test_contract_date_semantics.py
          tests/test_dados_abertos_sc_crawler.py
          tests/test_act_classifier.py
          tests/test_smoke_pncp_public.py
          tests/test_sc_compras_smoke.py
          tests/test_contracts_uf_filter.py
          tests/test_mandatory_gates_no_or_true.py
          tests/test_weekly_cycle.py
          -m "not integration and not database and not live"
          -o addopts=''
          --cov=scripts.freshness_gate
          --cov=scripts.coverage.freshness_by_entity
          --cov=scripts.lib.universe
          --cov=scripts.consulting_readiness
          --cov=scripts.coverage_truth
          --cov=scripts.golden_path
          --cov=scripts.crawl.run_contracts_90d_pilot
          --cov=scripts.crawl.act_classifier
          --cov=scripts.crawl.date_semantics
          --cov=scripts.crawl.run_evidence
          --cov=scripts.reports.commercial_sample_sc
          --cov=scripts.ops.weekly_cycle
          --cov=scripts.collect.run_contract
          --cov=scripts.quality.indicator_catalog
          --cov-report=term-missing
          --cov-report=html:docs/td-001/coverage-reports/
          --cov-fail-under=10
          --tb=short
          -v
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: docs/td-001/coverage-reports/
          retention-days: 14

  # ============================================================================
  # TEST ALL — inclui integration, smoke, slow (gate completo)
  # ============================================================================
  # Expanded operational suite on every PR (fail-closed, explicit file list).
  # Intentionally NOT "all non-integration tests": full collection still has residual
  # debt (schema/env). Residual isolations: docs/ops/campaigns/EXTRA-OPERATIONAL-PROOF-01/STATUS.md
  test-operational-expanded:
    name: Test operational expanded (PR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov hypothesis

      - name: Operational expanded unit suite
        run: >-
          pytest
          tests/test_weekly_cycle.py
          tests/test_run_evidence.py
          tests/test_freshness_gate.py
          tests/test_freshness_by_entity.py
          tests/test_mandatory_gates_no_or_true.py
          tests/test_golden_path_fail_closed.py
          tests/test_golden_path_ledger.py
          tests/test_evidence_artifact_consistency.py
          tests/test_contract_date_semantics.py
          tests/test_coverage_truth.py
          tests/test_consulting_readiness.py
          -m "not integration and not database and not slow and not e2e and not live"
          -o addopts=''
          --cov=scripts.ops.weekly_cycle
          --cov=scripts.collect.run_contract
          --cov=scripts.quality.indicator_catalog
          --cov=scripts.crawl.run_evidence
          --cov-report=term-missing
          --cov-fail-under=35
          --tb=short
          -v
        env:
          CI: true

  test-all:
    name: Test All (full suite)
    # Canonical global suite — same semantics as `make test-all` /
    # `python -m scripts.ops.run_full_suite` (no implicit slow exclusion).
    # Runs on PR→main, push→main, and workflow_dispatch.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: extra_full_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d extra_full_suite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/extra_full_suite
      LOCAL_DATALAKE_DSN: postgresql://test:test@localhost:5432/extra_full_suite
      REQUIRE_REAL_DB: "1"
      RESILIENCE_REQUIRE_DB: "1"
      RESILIENCE_ENV: test
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov hypothesis psycopg2-binary openpyxl prometheus_client

      - name: Canonical full suite (migrations + seeds + pytest no marker exclusion)
        run: python -m scripts.ops.run_full_suite

  # ============================================================================
  # RESILIENCE GATE — pre-VPS truth (fail-closed, no continue-on-error)
  # ============================================================================
  resilience-gate:
    name: Resilience Gate (pre-VPS)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: migrations include CREATE EXTENSION vector
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pncp_datalake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d pncp_datalake"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/pncp_datalake
      RESILIENCE_ENV: test
      RESILIENCE_REQUIRE_DB: "0"
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov hypothesis psycopg2-binary prometheus_client

      - name: Ruff resilience modules
        run: >
          ruff check
          scripts/crawl/ingestion/_base/crawler.py
          scripts/crawl/resilience
          scripts/ops
          tests/test_local_resilience.py
          tests/test_resilience_vertical_slice.py

      - name: Mypy resilience modules
        run: >
          mypy --follow-imports=skip
          scripts/crawl/ingestion/_base/crawler.py
          scripts/crawl/resilience
          scripts/ops/resilient_cycle.py
          scripts/ops/health.py
          scripts/ops/validate_systemd.py

      - name: Validate systemd units
        run: python -m scripts.ops.validate_systemd

      - name: Migrations + resilience tests + fixture isolation (single step)
        # Single step keeps PG service state: restarts between steps can wipe ephemeral volumes.
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/pncp_datalake
          RESILIENCE_ENV: test
        run: |
          set -euo pipefail
          python -m scripts.ops.apply_migrations --mode fresh --min 1 --max 54
          python - <<'PY'
          import os, psycopg2, sys
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("SELECT current_database(), current_user")
          print("conn", cur.fetchone())
          cur.execute("SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          n = cur.fetchone()[0]
          print("public_tables", n)
          cur.execute("SELECT 1 FROM pg_proc WHERE proname='upsert_pncp_raw_bids' LIMIT 1")
          has = cur.fetchone() is not None
          print("has_upsert", has)
          cur.close(); conn.close()
          if n < 1 or not has:
              sys.exit("schema verification failed after fresh migrations")
          PY
          # Upgrade path on a second database
          PGPASSWORD=test psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS pncp_upgrade;"
          PGPASSWORD=test psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE pncp_upgrade;"
          DATABASE_URL=postgresql://test:test@localhost:5432/pncp_upgrade \
            python -m scripts.ops.apply_migrations --mode fresh --min 1 --max 40
          DATABASE_URL=postgresql://test:test@localhost:5432/pncp_upgrade \
            python -m scripts.ops.apply_migrations --mode upgrade --min 41 --max 54
          # Unit/chaos offline
          pytest -o addopts='' -q \
            tests/test_local_resilience.py \
            tests/test_resilience_vertical_slice.py \
            tests/test_fetch_result.py \
            tests/test_watermark.py \
            tests/test_dlq.py \
            -m "not slow and not e2e and not database" \
            --tb=short
          # Real PG vertical slice — re-assert schema immediately before tests
          python - <<'PY'
          import os, psycopg2, sys
          dsn = os.environ["DATABASE_URL"]
          print("vertical_dsn", dsn)
          conn = psycopg2.connect(dsn)
          cur = conn.cursor()
          cur.execute("SELECT current_database(), current_user")
          print("vertical_conn", cur.fetchone())
          cur.execute("SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          n = cur.fetchone()[0]
          print("vertical_public_tables", n)
          cur.close(); conn.close()
          if n < 1:
              # Re-apply if service volume was wiped
              import subprocess
              subprocess.check_call([sys.executable, "-m", "scripts.ops.apply_migrations", "--mode", "fresh", "--min", "1", "--max", "54"])
          PY
          RESILIENCE_REQUIRE_DB=1 DATABASE_URL="$DATABASE_URL" pytest -o addopts='' -q \
            tests/test_resilience_vertical_slice.py \
            -m "database and not slow" \
            --tb=short
          # Fixture cycle isolation
          export RESILIENCE_STATE_PATH="$RUNNER_TEMP/resilience-ci"
          export RESILIENCE_ENV=fixture
          export RESILIENCE_REQUIRE_DB=0
          export RESILIENCE_PAGE_SIZE=1
          export RESILIENCE_REQUEST_DELAY=0
          python -m scripts.ops.resilient_cycle --env fixture
          python -m scripts.ops.health --env fixture
          set +e
          python -m scripts.ops.health --env development
          code=$?
          set -e
          test "$code" -eq 2

      - name: Upload resilience artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resilience-gate-artifacts
          path: |
            output/resilience/
            ${{ runner.temp }}/resilience-ci/
          retention-days: 14
          if-no-files-found: ignore

  # ==========================================================================
  # GENERATED ARTIFACTS POLICY — fail-closed (no heavy pack outputs in Git)
  # ==========================================================================
  generated-artifacts-policy:
    name: Generated Artifacts Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run generated artifacts policy gate
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            git fetch --no-tags origin main
            BASE_REF="origin/main"
          fi
          git rev-parse --verify "$BASE_REF"
          python -m scripts.ops.check_generated_artifacts_policy --base "$BASE_REF"

  # PR Reviewability Policy lives in .github/workflows/pr-reviewability.yml
  # (light workflow: opened/synchronize/reopened/ready_for_review/edited).
  # Job name remains "PR Reviewability Policy" — required on main protection.

  # ============================================================================
  # SECURITY — bandit (fail-closed, sem continue-on-error)
  # ============================================================================
  # ==========================================================================
  # PYTEST SKIP POLICY — no module-level importorskip hiding adversarial suites
  # ==========================================================================
  pytest-skip-policy:
    name: Pytest Skip Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pytest skip policy gate
        run: |
          set -euo pipefail
          python -m scripts.ops.check_pytest_skip_policy --root tests

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run bandit security scan
        # Policy blocks HIGH findings; MEDIUM/LOW are tracked as technical debt.
        run: bandit -r scripts/ -lll -q

  # ============================================================================
  # DEPENDENCY AUDIT — pip-audit (fail-closed)
  # ============================================================================
  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --strict

  confenge-contract-relevance:
    name: CONFENGE Contract Relevance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Adversarial + holdout eval
        run: |
          make test-confenge-contract-relevance

  confenge-sector-fit:
    name: CONFENGE Sector Fit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Sector fit + properties + anti-overfit
        run: |
          make test-confenge-sector-fit
          make test-confenge-sector-fit-properties
          python -m pytest tests/commercial_leads/test_anti_overfitting.py -q --tb=short -o addopts=
      - name: Denominator integrity (synthetic adversarial)
        run: make verify-confenge-denominator-integrity

  confenge-commercial-code-quality:
    name: CONFENGE Commercial Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Profile + catalog schema
        run: |
          python -c "from scripts.commercial_leads.profile import load_profile; p=load_profile('config/commercial_profiles/confenge.yaml'); assert p.profile_id=='confenge'; assert len(p.signal_ids)>=12"
      - name: Full commercial_leads unit suite
        run: |
          python -m pytest tests/commercial_leads/ -q --tb=short -o addopts=
      - name: Holdout corpus frozen + sector eval present
        run: |
          test -f evals/commercial_leads/holdout-v1.jsonl
          test -f evals/commercial_leads/sector-fit-v1.jsonl
          test -f evals/commercial_leads/corpus-splits.json
          python -c "from pathlib import Path; n=sum(1 for _ in Path('evals/commercial_leads/holdout-v1.jsonl').open()); assert n>=30, n"
      - name: No RC_TECHNICAL_PASS claim in result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/campaigns/CONFENGE-COMMERCIAL-READY-01/result.json")
          assert p.is_file(), "result.json missing"
          d = json.loads(p.read_text())
          assert d.get("technical_status") != "RC_TECHNICAL_PASS"
          assert d.get("status") != "RC_TECHNICAL_PASS"
          assert d.get("status") in ("PASS", "BLOCKED", "FAIL"), d.get("status")
          # Human metrics must be null or PENDING until dual human labels exist
          hm = d.get("human_metrics") or {}
          if "precision_at_10" in d or "precision_at_10" in hm:
              assert d.get("precision_at_10") is None or hm.get("precision_at_10") is None or hm.get("human_review_status") == "COMPLETE"
          PY
      - name: Gold-standard baseline present
        run: |
          test -f artifacts/campaigns/CONFENGE-COMMERCIAL-READY-01/gold-standard-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("artifacts/campaigns/CONFENGE-COMMERCIAL-READY-01/gold-standard-baseline.json").read_text())
          assert d.get("status") == "BLOCKED_COMMERCIAL_RELEVANCE_NOT_PROVEN"
          assert "DENOMINATOR_CONTAMINATION" in {x["id"] for x in d.get("known_methodological_defects") or []}
          PY
      - name: Artifact SHA binding gate
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m scripts.ops.verify_confenge_artifact_binding \
            --head "${PR_HEAD_SHA}" \
            --result artifacts/campaigns/CONFENGE-COMMERCIAL-READY-01/result.json \
            --queue-summary artifacts/campaigns/CONFENGE-COMMERCIAL-READY-01/queue-summary.json
      - name: Ranking stability artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/campaigns/CONFENGE-COMMERCIAL-READY-01/ranking-stability.json")
          assert p.is_file(), "ranking-stability.json missing"
          d = json.loads(p.read_text())
          assert "same_snapshot" in d or d.get("ok") is True
          if d.get("ok") is not True and not d.get("same_snapshot", {}).get("ok"):
              raise SystemExit(f"ranking_stability incomplete: {d}")
          PY
      - name: Human evaluation honestly pending
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/campaigns/CONFENGE-COMMERCIAL-READY-01/independent-review.json")
          d = json.loads(p.read_text()) if p.is_file() else {}
          # Agents must NOT claim human precision numbers
          if d.get("human_review_status") in (None, "PENDING", "BLOCKED_INSUFFICIENT_HUMAN_LABELS"):
              assert d.get("precision_at_10") in (None, "NOT_COMPUTABLE") or d.get("labels_are_human") is False
          print({"human_review_status": d.get("human_review_status"), "precision_at_10": d.get("precision_at_10")})
          PY

  # Structural aggregate only — not full commercial validity
  confenge-commercial-validity:
    name: CONFENGE Structural Commercial Checks
    needs: [confenge-contract-relevance, confenge-sector-fit, confenge-commercial-code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Structural commercial gates (unit/synthetic)
        run: |
          make verify-confenge-all-status-history
          make verify-confenge-active-vs-historical-separation
          make verify-confenge-end-to-end-reproducibility
          make verify-confenge-snapshot-manifest-immutability
          # Registry independence detector unit tests (bias on last run is BLOCKED exit 2)
          python3 -m pytest tests/commercial_leads/test_registry_selection_independence.py -q --tb=short -o addopts=
          set +e
          make verify-confenge-registry-selection-independence
          reg_code=$?
          set -e
          test "$reg_code" = "0" -o "$reg_code" = "2"
      - name: Real holdout evaluation (expect BLOCKED until dual human labels)
        run: |
          set +e
          make evaluate-confenge-real-contract-holdout
          code=$?
          set -e
          # exit 2 = BLOCKED (honest), not green success for unlabeled corpus
          test "$code" = "2" -o "$code" = "0"
      - name: Declare remaining BLOCKED evidence checks
        run: |
