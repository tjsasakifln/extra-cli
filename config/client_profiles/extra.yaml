# Exclusões setoriais (salvo override explícito no perfil)
exclusion_categories:
  - saude_assistencial
  - medicamentos
  - exames
  - roupas_vestuario
  - alimentos
  - computadores_ti
  - veiculos_frota
  - combustiveis
