      Baixa capacidade preparatória para estruturar obras e serviços de engenharia
      (DFD, ETP, TR, quantidades, riscos, orçamento e cronograma).
    publico_alvo:
      - prefeituras de pequeno e médio porte
      - autarquias e fundações públicas
      - consórcios públicos
    escopo: >
      Apoio técnico à estruturação da fase preparatória de obras e serviços de engenharia.
    entregaveis:
      - diagnostico_da_necessidade
      - subsidios_ao_DFD
      - estudo_tecnico_preliminar
      - levantamento_de_alternativas
      - estimativas_de_quantidades
      - memorias_de_calculo
      - analise_de_mercado
      - matriz_de_riscos
      - termo_de_referencia
