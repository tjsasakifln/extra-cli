# Direct contracting value thresholds — versioned, temporal, jurisdiction-scoped.
# Annual updates: append a new threshold row with effective_from; do not hardcode amounts in Python.
# Comparison: amount must be STRICTLY INFERIOR to threshold (equal → not eligible).
# Legal eligibility language for commercial intelligence: POTENTIALLY_ELIGIBLE_FOR_DIRECT_CONTRACTING only.
# Never claim DISPENSA_GARANTIDA, CONTRATAÇÃO_DIRETA_AUTORIZADA, ÓRGÃO_PODE_CONTRATAR, SEM_LICITAÇÃO.

